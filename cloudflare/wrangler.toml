name = "mereb-signaling"
main = "worker.js"
compatibility_date = "2024-09-23"

[durable_objects]
bindings = [
  { name = "GAME_ROOM", class_name = "GameRoom" }
]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["GameRoom"]

[vars]
# Public OAuth Client ID (Safe to commit)
GITHUB_CLIENT_ID = "Ov23lizozUDKwKt6LRJr"

# Polar Billing Configuration (Public checkout URLs / Org ID)
# Secret tokens (POLAR_ACCESS_TOKEN, POLAR_WEBHOOK_SECRET, GITHUB_CLIENT_SECRET)
# must be placed in cloudflare/.dev.vars locally or added via `wrangler secret put <KEY>` in production.
POLAR_ORGANIZATION_ID = ""
POLAR_CHECKOUT_PRO_URL = ""
POLAR_CHECKOUT_STUDIO_URL = ""

[observability]
enabled = true
